name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    paths-ignore:
    - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        emacs_version:
          - 30.1
        experimental: [true]
        include:
          - emacs_version: snapshot
            experimental: true
    steps:
    - uses: purcell/setup-emacs@master # runs ``test-startup.sh'' across 
      with:
        version: ${{ matrix.emacs_version }}
